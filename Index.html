<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Угадай слово по мысли</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #08111f;
    --card: #101d31;
    --card2: #162640;
    --text: #f4f7ff;
    --muted: #91a4c2;
    --primary: #4d8dff;
    --primary2: #6b5cff;
    --success: #32d583;
    --danger: #ff5577;
    --gold: #ffc857;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 20% 10%, #182f5d 0, transparent 35%),
        radial-gradient(circle at 90% 90%, #25194e 0, transparent 35%),
        var(--bg);
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 520px;
    padding: 40px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 28px;
    background: rgba(16,29,49,.9);
    box-shadow: 0 30px 100px rgba(0,0,0,.45);
    text-align: center;
}

.logo {
    font-size: 58px;
    margin-bottom: 8px;
}

h1 {
    margin: 0 0 10px;
    font-size: 34px;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 30px;
}

.profile-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.profile-btn {
    padding: 20px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    color: white;
    background: var(--card2);
    transition: .2s;
}

.profile-btn:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
    background: #1b3153;
}

/* APP */

.app {
    min-height: 100vh;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(18px);
    background: rgba(8,17,31,.8);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.nav {
    max-width: 1200px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.brand {
    font-weight: 800;
    font-size: 20px;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.balance {
    background: rgba(255,200,87,.12);
    border: 1px solid rgba(255,200,87,.3);
    color: var(--gold);
    padding: 9px 14px;
    border-radius: 12px;
    font-weight: 700;
}

.small-btn {
    border: 0;
    color: white;
    background: #243653;
    border-radius: 10px;
    padding: 9px 12px;
}

.container {
    max-width: 1050px;
    margin: auto;
    padding: 35px 20px 70px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tab {
    border: 0;
    color: var(--muted);
    background: var(--card);
    padding: 12px 20px;
    border-radius: 12px;
}

.tab.active {
    color: white;
    background: var(--primary);
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* GAME */

.game-card {
    max-width: 800px;
    margin: auto;
    padding: 35px;
    border-radius: 28px;
    background: rgba(16,29,49,.9);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 25px 80px rgba(0,0,0,.3);
}

.game-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    margin-bottom: 25px;
}

.progress {
    height: 8px;
    background: #263752;
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-fill {
    height: 100%;
    width: 14%;
    background: linear-gradient(90deg, var(--primary), var(--primary2));
    transition: .3s;
}

.thought-label {
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 12px;
}

.question {
    font-size: 27px;
    line-height: 1.35;
    margin-bottom: 25px;
}

.answer-form {
    display: flex;
    gap: 10px;
}

.answer-input {
    min-width: 0;
    flex: 1;
    border: 1px solid #304362;
    outline: none;
    color: white;
    background: #0b1627;
    padding: 16px;
    border-radius: 14px;
}

.answer-input:focus {
    border-color: var(--primary);
}

.main-btn {
    border: 0;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--primary2));
    padding: 15px 22px;
    border-radius: 14px;
    font-weight: 700;
}

.main-btn:hover {
    filter: brightness(1.12);
}

.hint {
    color: var(--muted);
    margin-top: 15px;
    font-size: 14px;
}

.result {
    text-align: center;
    padding: 20px 0 5px;
}

.result-icon {
    font-size: 70px;
}

.result h2 {
    font-size: 32px;
}

.reward {
    color: var(--gold);
    font-size: 22px;
    font-weight: 800;
}

.next-btn {
    margin-top: 20px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: var(--card);
    border: 1px solid rgba(255,255,255,.07);
    padding: 25px;
    border-radius: 18px;
}

.stat-number {
    font-size: 30px;
    font-weight: 800;
}

.stat-label {
    color: var(--muted);
    margin-top: 5px;
}

/* SHOP */

.shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.theme-card {
    padding: 22px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.08);
}

.theme-preview {
    height: 100px;
    border-radius: 14px;
    margin-bottom: 18px;
}

.theme-card h3 {
    margin: 0 0 8px;
}

.theme-card p {
    color: var(--muted);
    min-height: 40px;
}

.price {
    color: var(--gold);
    font-weight: 800;
    margin: 15px 0;
}

.theme-btn {
    width: 100%;
    border: 0;
    padding: 12px;
    border-radius: 12px;
    color: white;
    background: #263b5d;
}

.theme-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.theme-btn.active {
    background: var(--success);
}

/* THEMES */

body.theme-neon {
    --bg: #07050d;
    --card: #110d1d;
    --card2: #1b1029;
    --primary: #b84dff;
    --primary2: #26e6a3;
}

body.theme-gold {
    --bg: #100d08;
    --card: #1b160c;
    --card2: #2a2110;
    --primary: #d8a72c;
    --primary2: #ffe49a;
    --gold: #ffd76a;
}

body.theme-retro {
    --bg: #101010;
    --card: #1c1c1c;
    --card2: #272727;
    --primary: #42e66b;
    --primary2: #ffe047;
    font-family: "Courier New", monospace;
}

body.theme-cyber {
    --bg: #050914;
    --card: #081827;
    --card2: #0c2635;
    --primary: #00eaff;
    --primary2: #ff00cc;
}

/* MOBILE */

@media (max-width: 650px) {
    .login-box {
        padding: 28px 20px;
    }

    .profile-buttons {
        grid-template-columns: 1fr;
    }

    .nav {
        flex-wrap: wrap;
    }

    .game-card {
        padding: 23px;
    }

    .question {
        font-size: 22px;
    }

    .answer-form {
        flex-direction: column;
    }

    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="login-screen">
    <div class="login-box">
        <div class="logo">🧠</div>
        <h1>Угадай слово</h1>
        <div class="subtitle">По мысли. По подсказке. По интуиции.</div>

        <p>Выберите профиль:</p>

        <div class="profile-buttons">
            <button class="profile-btn" onclick="login('МишаBYS')">
                👤<br><br>
                <b>МишаBYS</b>
            </button>

            <button class="profile-btn" onclick="login('ЖеняBYS')">
                👤<br><br>
                <b>ЖеняBYS</b>
            </button>
        </div>
    </div>
</section>

<!-- APP -->
<div id="app" class="app hidden">

<header>
    <div class="nav">
        <div class="brand">🧠 Угадай слово</div>

        <div class="user-info">
            <div class="balance">🧠 <span id="balance">0</span></div>
            <span id="username"></span>
            <button class="small-btn" onclick="logout()">Выйти</button>
        </div>
    </div>
</header>

<main class="container">

    <div class="tabs">
        <button class="tab active" onclick="showPage('game', this)">🎮 Игра</button>
        <button class="tab" onclick="showPage('stats', this)">📊 Статистика</button>
        <button class="tab" onclick="showPage('shop', this)">🎨 Магазин</button>
    </div>

    <!-- GAME -->
    <section id="gamePage" class="page active">

        <div class="game-card">

            <div class="game-top">
                <span id="questionNumber">Мысль 1 из 7</span>
                <span id="potentialReward">Награда: 100 🧠</span>
            </div>

            <div class="progress">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <div id="gameContent">

                <div class="thought-label">💭 Мысль</div>

                <div id="question" class="question"></div>

                <form class="answer-form" onsubmit="checkAnswer(event)">
                    <input
                        id="answerInput"
                        class="answer-input"
                        autocomplete="off"
                        placeholder="Введите ваш ответ..."
                    >
                    <button class="main-btn" type="submit">
                        Ответить
                    </button>
                </form>

                <div class="hint">
                    Чем раньше угадаешь — тем больше 🧠 получишь!
                </div>

            </div>

            <div id="result" class="result hidden"></div>

        </div>

    </section>

    <!-- STATS -->
    <section id="statsPage" class="page">

        <h2>📊 Статистика</h2>

        <div class="stats">
            <div class="stat">
                <div id="wins" class="stat-number">0</div>
                <div class="stat-label">Побед</div>
            </div>

            <div class="stat">
                <div id="losses" class="stat-number">0</div>
                <div class="stat-label">Поражений</div>
            </div>

            <div class="stat">
                <div id="wordsCount" class="stat-number">0</div>
                <div class="stat-label">Угадано слов</div>
            </div>
        </div>

        <div class="game-card">
            <h2>🏆 Последние результаты</h2>
            <div id="history"></div>
        </div>

    </section>

    <!-- SHOP -->
    <section id="shopPage" class="page">

        <h2>🎨 Магазин дизайнов</h2>
        <p class="subtitle">Покупайте темы за 🧠 Мыслишки.</p>

        <div id="shopGrid" class="shop-grid"></div>

    </section>

</main>
</div>

/* =========================================
   СОСТОЯНИЕ
========================================= */

let currentUser = null;
let currentGame = null;
let currentQuestion = 0;

function defaultProfile() {
    return {
        balance: 0,
        wins: 0,
        losses: 0,
        guessedWords: [],
        history: [],
        themes: ["classic"],
        activeTheme: "classic"
    };
}

function getProfiles() {
    return JSON.parse(localStorage.getItem("guessProfiles") || "{}");
}

function saveProfiles(profiles) {
    localStorage.setItem("guessProfiles", JSON.stringify(profiles));
}

function getProfile() {
    const profiles = getProfiles();

    if (!profiles[currentUser]) {
        profiles[currentUser] = defaultProfile();
        saveProfiles(profiles);
    }

    return profiles[currentUser];
}

function saveProfile(profile) {
    const profiles = getProfiles();
    profiles[currentUser] = profile;
    saveProfiles(profiles);
}


/* =========================================
   LOGIN
========================================= */

function login(name) {
    currentUser = name;

    const profiles = getProfiles();

    if (!profiles[name]) {
        profiles[name] = defaultProfile();
        saveProfiles(profiles);
    }

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("username").textContent = name;

    applyTheme();
    updateBalance();
    updateStats();

    startGame();
}

function logout() {
    currentUser = null;
    currentGame = null;

    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
}


/* =========================================
   ИГРА
========================================= */

function getRandomWord() {
    return words[Math.floor(Math.random() * words.length)];
}

function startGame() {
    currentGame = getRandomWord();
    currentQuestion = 0;

    document.getElementById("gameContent").classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");

    document.getElementById("answerInput").value = "";

    renderQuestion();

    setTimeout(() => {
        document.getElementById("answerInput").focus();
    }, 100);
}

function renderQuestion() {
    const q = currentGame.questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Мысль ${currentQuestion + 1} из 7`;

    document.getElementById("potentialReward").textContent =
        `Награда: ${rewards[currentQuestion]} 🧠`;

    document.getElementById("progressFill").style.width =
        `${((currentQuestion + 1) / 7) * 100}%`;

    document.getElementById("question").textContent = q;

    document.getElementById("answerInput").value = "";
}

function normalize(text) {
    return text
        .toLowerCase()
        .trim()
        .replace(/ё/g, "е")
        .replace(/[.,!?;:"'«»()\-]/g, "")
        .replace(/\s+/g, " ");
}

function checkAnswer(event) {
    event.preventDefault();

    const input = normalize(
        document.getElementById("answerInput").value
    );

    if (!input) return;

    const answer = normalize(currentGame.word);

    /*
       Принимаем точное слово.
       Также разрешаем ответы вроде:
       "это солнце"
       "я думаю солнце"
    */
    const correct =
        input === answer ||
        input.includes(answer);

    if (correct) {
        winGame();
        return;
    }

    if (currentQuestion < 6) {
        currentQuestion++;
        renderQuestion();

        showTemporaryMessage("❌ Не угадал! Следующая мысль уже открыта.");
    } else {
        loseGame();
    }
}

function showTemporaryMessage(text) {
    const hint = document.querySelector(".hint");
    const old = hint.textContent;

    hint.textContent = text;
    hint.style.color = "var(--danger)";

    setTimeout(() => {
        hint.textContent = old;
        hint.style.color = "";
    }, 1200);
}

function winGame() {
    const profile = getProfile();
    const reward = rewards[currentQuestion];

    profile.balance += reward;
    profile.wins++;

    if (!profile.guessedWords.includes(currentGame.word)) {
        profile.guessedWords.push(currentGame.word);
    }

    profile.history.unshift({
        word: currentGame.word,
        result: "win",
        question: currentQuestion + 1,
        reward: reward,
        date: new Date().toLocaleString("ru-RU")
    });

    profile.history = profile.history.slice(0, 20);

    saveProfile(profile);

    updateBalance();
    updateStats();

    document.getElementById("gameContent").classList.add("hidden");

    document.getElementById("result").classList.remove("hidden");

    document.getElementById("result").innerHTML = `
        <div class="result-icon">🎉</div>
        <h2>Правильно!</h2>
        <p>Слово: <b>${escapeHtml(currentGame.word)}</b></p>
        <div class="reward">+${reward} 🧠</div>
        <button class="main-btn next-btn" onclick="startGame()">
            Следующее слово →
        </button>
    `;
}

function loseGame() {
    const profile = getProfile();

    profile.losses++;

    profile.history.unshift({
        word: currentGame.word,
        result: "loss",
        question: 7,
        reward: 0,
        date: new Date().toLocaleString("ru-RU")
    });

    profile.history = profile.history.slice(0, 20);

    saveProfile(profile);

    updateStats();

    document.getElementById("gameContent").classList.add("hidden");

    document.getElementById("result").classList.remove("hidden");

    document.getElementById("result").innerHTML = `
        <div class="result-icon">😢</div>
        <h2>Попытки закончились</h2>
        <p>Загаданное слово было:</p>
        <div class="reward">${escapeHtml(currentGame.word)}</div>
        <p>Награда: 0 🧠</p>

        <button class="main-btn next-btn" onclick="startGame()">
            Попробовать ещё →
        </button>
    `;
}


/* =========================================
   БАЛАНС / СТАТИСТИКА
========================================= */

function updateBalance() {
    document.getElementById("balance").textContent =
        getProfile().balance;
}

function updateStats() {
    const profile = getProfile();

    document.getElementById("wins").textContent =
        profile.wins;

    document.getElementById("losses").textContent =
        profile.losses;

    document.getElementById("wordsCount").textContent =
        profile.guessedWords.length;

    const history = document.getElementById("history");

    if (!profile.history.length) {
        history.innerHTML =
            `<p class="subtitle">Пока нет сыгранных раундов.</p>`;
        return;
    }

    history.innerHTML = profile.history.map(item => `
        <div style="
            padding:15px 0;
            border-bottom:1px solid rgba(255,255,255,.07);
            display:flex;
            justify-content:space-between;
            gap:15px;
        ">
            <div>
                ${item.result === "win" ? "✅" : "❌"}
                <b>${escapeHtml(item.word)}</b>
                <div style="color:var(--muted);font-size:13px">
                    ${item.date}
                </div>
            </div>

            <div style="text-align:right">
                ${item.result === "win"
                    ? `+${item.reward} 🧠`
                    : `0 🧠`}
            </div>
        </div>
    `).join("");
}


/* =========================================
   НАВИГАЦИЯ
========================================= */

function showPage(page, button) {
    document.querySelectorAll(".page")
        .forEach(el => el.classList.remove("active"));

    document.querySelectorAll(".tab")
        .forEach(el => el.classList.remove("active"));

    document.getElementById(page + "Page")
        .classList.add("active");

    button.classList.add("active");

    if (page === "stats") {
        updateStats();
    }

    if (page === "shop") {
        renderShop();
    }
}


/* =========================================
   МАГАЗИН
========================================= */

function renderShop() {
    const profile = getProfile();

    document.getElementById("shopGrid").innerHTML =
        themes.map(theme => {

            const owned = profile.themes.includes(theme.id);
            const active = profile.activeTheme === theme.id;

            let buttonText = "";

            if (active) {
                buttonText = "✓ Используется";
            } else if (owned) {
                buttonText = "Использовать";
            } else if (theme.price === 0) {
                buttonText = "Получить";
            } else {
                buttonText = `Купить за ${theme.price} 🧠`;
            }

            return `
                <div class="theme-card">

                    <div
                        class="theme-preview"
                        style="background:${theme.preview}"
                    ></div>

                    <h3>${theme.name}</h3>

                    <p>${theme.description}</p>

                    <div class="price">
                        ${theme.price === 0
                            ? "Бесплатно"
                            : theme.price + " 🧠"}
                    </div>

                    <button
                        class="theme-btn ${active ? "active" : ""}"
                        onclick="useTheme('${theme.id}')"
                        ${active ? "disabled" : ""}
                    >
                        ${buttonText}
                    </button>

                </div>
            `;
        }).join("");
}

function useTheme(themeId) {
    const profile = getProfile();
    const theme = themes.find(t => t.id === themeId);

    if (!theme) return;

    if (!profile.themes.includes(themeId)) {

        if (profile.balance < theme.price) {
            alert(
                `Недостаточно Мыслишек 🧠\n\n` +
                `Нужно: ${theme.price} 🧠\n` +
                `У вас: ${profile.balance} 🧠`
            );
            return;
        }

        profile.balance -= theme.price;
        profile.themes.push(themeId);
    }

    profile.activeTheme = themeId;

    saveProfile(profile);

    applyTheme();
    updateBalance();
    renderShop();
}

function applyTheme() {
    const profile = getProfile();

    document.body.classList.remove(
        "theme-neon",
        "theme-gold",
        "theme-retro",
        "theme-cyber"
    );

    const theme = themes.find(
        t => t.id === profile.activeTheme
    );

    if (theme && theme.className) {
        document.body.classList.add(theme.className);
    }
}


/* =========================================
   БЕЗОПАСНЫЙ HTML
========================================= */

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
